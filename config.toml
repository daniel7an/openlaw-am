# openlaw-am configuration.
#
# Everything that is not a secret lives here. The API key stays in .env — it is
# the one value that must never be committed.
#
# Any setting can still be overridden by an environment variable (the `env` name
# listed beside each one), which is what makes the on-prem swap a one-liner:
#   OPENLAW_BASE_URL=http://localhost:11434/v1 OPENLAW_MODEL=gemma3 uv run python rag.py "..."

[embedding]
# D4. e5-family finetune, so the query:/passage: prefixes below are mandatory —
# dropping them costs a lot of retrieval accuracy, silently.
model = "Metric-AI/armenian-text-embeddings-2-large"  # env: OPENLAW_EMBED_MODEL
dim = 1024
query_prefix = "query: "
passage_prefix = "passage: "

[chunking]
# The model truncates at 512 tokens without warning. Sized in tokens, not
# characters: Armenian runs ~4.1 chars/token and that ratio varies too much to fake.
# 511 is deliberately >= the dynamic ceiling (model_limit - reserve - title), so that
# term is what actually binds: bodies get every token the title leaves free (~500 max).
max_tokens = 511
overlap_tokens = 50

# The title is embedded alongside the body ("passage: {title}\n{text}"), so it competes
# for the same 512. Administrative-offence titles reach 140+ tokens, which pushed chunks
# over the limit when the body budget was a flat constant — the per-article budget is
# model_limit - reserve - len(title), capped at max_tokens.
model_limit = 512      # hard ceiling of the embedding model
reserve_tokens = 12    # BOS/EOS + "passage: " + newline, with slack

[weaviate]
host = "localhost"      # env: OPENLAW_WEAVIATE_HOST
port = 8080             # env: OPENLAW_WEAVIATE_PORT

# Indexes are versioned. Each build creates a NEW collection (Article_v1, Article_v2, ...)
# and never mutates an existing one; the `alias` is then repointed at it. Queries only
# ever name the alias, so switching or rolling back a corpus is atomic and needs no code
# change. Old versions stay queryable by their real name, which is what makes a
# before/after comparison on the benchmark possible.
alias = "Article"                  # env: OPENLAW_COLLECTION — what queries resolve through
collection_prefix = "Article_"     # versions auto-name as Article_v1, v2... or take --name

# The dashboard picks a version and queries that collection DIRECTLY, deliberately
# bypassing the alias — switching index in the UI is a per-session view change and must
# not repoint the alias out from under the CLI, eval.py, or anyone else hitting the box.
# This is only where the picker starts; "" means start on whatever the alias points at.
ui_default = "Article_all_codex_better_chunking"   # env: OPENLAW_UI_COLLECTION

[retrieval]
# Measured on the 18 labour benchmark questions at k=8:
#   bm25   (alpha 0.0) -> hit@1 22%  hit@3 39%  hit@8 61%
#   vector (alpha 1.0) -> hit@1 39%  hit@3 67%  hit@8 72%
#   hybrid (alpha 0.6) -> hit@1 44%  hit@3 72%  hit@8 72%
# 0.5-0.7 is a flat optimum; 0.6 sits mid-plateau rather than on a single-question spike.
mode = "hybrid"         # env: OPENLAW_SEARCH_MODE — "hybrid" | "vector" | "bm25"
alpha = 0.6             # env: OPENLAW_HYBRID_ALPHA — 1.0 = pure vector, 0.0 = pure BM25
top_k = 8
title_boost = 2         # BM25 weight on the article title vs its body

[generation]
base_url = "https://openrouter.ai/api/v1"   # env: OPENLAW_BASE_URL
model = "deepseek/deepseek-v4-pro"          # env: OPENLAW_MODEL
temperature = 0.1

# ⚠️ deepseek-v4-pro is a REASONING model: it burns completion tokens on a hidden
# reasoning trace before writing any answer (260 reasoning + ~356 answer on a typical
# question). At 800 this intermittently returned an EMPTY answer — the budget ran out
# mid-reasoning. This ceiling must cover reasoning + answer, not just the answer.
# 8000: at 2000 a third of the k=10 benchmark run hit the ceiling (15/44 answers
# truncated mid-reasoning, concentrated in hard questions). Gemma's vLLM serves
# max_model_len=20000, so prompt (~7K at k=10) + 8000 still fits.
max_output_tokens = 8000

# Which backend the app.py picker starts on, by its `name` below. Same idea as
# weaviate.ui_default: a per-session UI choice that must not change what the CLI
# and eval.py hit through `model` / `base_url` above.
ui_default = "Gemma 4 26B · 4B active (on-premise)"   # env: OPENLAW_UI_MODEL

# Backends the dashboard can switch between at runtime. `model` / `base_url` above stay
# the defaults for the CLI and eval.py; these only drive the picker in app.py. They
# mirror the two targets in run_eval.sh, so a number seen in the demo and a number from
# the benchmark come from the same endpoint.
#
# Costs are USD per 1M tokens, used for the per-question cost readout. A self-hosted
# backend sets them to 0 and the UI says "self-hosted" instead of a price.
[[generation.backends]]
name = "DeepSeek V4 Pro (hosted)"
model = "deepseek/deepseek-v4-pro"
base_url = "https://openrouter.ai/api/v1"
prompt_cost = 0.435
completion_cost = 0.87
note = "Reasoning model — thinks before answering"

[[generation.backends]]
name = "Gemma 4 26B · 4B active (on-premise)"
model = "google/gemma-4-26B-A4B-it"   # case-sensitive: vLLM matches the name exactly
base_url = "http://localhost:18000/v1"
api_key = "EMPTY"                     # vLLM is unauthenticated; the client needs a non-empty key
prompt_cost = 0.0
completion_cost = 0.0
note = "Open MoE model, runs on our own hardware"
hint = "ssh -N -L 18000:localhost:8000 spark-alpha"

[[generation.backends]]
name = "Gemma 4 26B · 4B active (hosted)"
model = "google/gemma-4-26b-a4b-it"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENLAW_BACKUP_API_KEY"   # the main account is provider-locked to deepseek
note = "Same open model, served by a cloud provider"

[eval]
# Answer models compared in the Streamlit Eval page / `uv run python eval.py --compare`.
# All go through generation.base_url (OpenRouter by default). Edit freely.
models = [
  "deepseek/deepseek-v4-pro",
  "openai/gpt-4o-mini",
  "google/gemini-2.5-flash",
]

[paths]
raw = "data/raw"
corpus = "data/corpus.json"
chunks = "data/chunks.jsonl"
embeddings = "data/embeddings"
index_manifest = "data/index_versions.json"   # what each index version contains
